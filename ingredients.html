<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>准备食材｜二三郎的月饼工房</title>
  <style>
    * { box-sizing:border-box; } body { margin:0; min-width:320px; overflow:hidden; background:#e17243; font-family:"Microsoft YaHei",sans-serif; }
    .screen { position:relative; height:100svh; overflow:hidden; }
    .background { position:absolute; inset:0; background:#e17243 url("assets/ingredients/ingredients-wall.png") center top / cover no-repeat; }
    .background::before { content:""; position:absolute; top:28.1%; right:0; bottom:16%; left:0; background:url("assets/ingredients/ingredients-tile.png") center top / auto 100% repeat-x; }
    .background::after { content:""; position:absolute; right:0; bottom:0; left:0; height:16%; background:#f7e0b4 url("assets/ingredients/ingredients-bottom.png") center bottom / auto 100% repeat-x; }
    .artboard { position:absolute; top:0; left:50%; width:1080px; height:1920px; transform:translateX(-50%) scale(var(--scale,.5)); transform-origin:top center; }
    .artboard img { position:absolute; display:block; pointer-events:none; user-select:none; }
    .title { width:494px; top:82px; left:293px; }.food { position:absolute; padding:0; border:0; background:transparent; cursor:pointer; transition:transform .18s ease-out; }.food:hover { transform:translateY(-26px) rotate(-2deg); }.food:active { transform:translateY(-20px) scale(.96); }.food.used { pointer-events:none; }
    .food img { position:static; width:100%; height:auto; }.flour { width:272px; top:250px; left:calc(112px - var(--side,0px)); }.sugar { width:229px; top:246px; left:426px; }.oil { width:290px; top:247px; left:calc(688px + var(--side,0px)); }
    .whisk { width:254px; top:838px; left:calc(0px - var(--side,0px)); }.spatula { width:312px; top:672px; left:calc(848px + var(--side,0px)); }
    .mixing-bowl { position:absolute; z-index:2; top:612px; left:300px; width:481px; height:472px; padding:0; border:0; background:transparent; }.mixing-bowl img { position:static; width:100%; height:100%; transform-origin:center center; }
    .prompt,.next { position:absolute; z-index:3; display:grid; place-items:center; padding:0; border:0; background:transparent; }.prompt { width:728px; height:227px; top:1111px; left:176px; }.next { width:555px; height:238px; top:1110px; left:263px; cursor:pointer; }.prompt img,.next img { position:static; width:auto; height:auto; max-width:100%; max-height:100%; }.next[hidden],.prompt[hidden] { display:none; }
    .character { bottom:0; z-index:1; transform-origin:left bottom; }.left { width:496px; left:var(--character-left,32px); transform:scale(var(--character-scale,1)); }.right { width:481px; left:var(--character-right,587px); z-index:2; transform:scale(var(--character-scale,1)); }.artboard .title,.artboard .food,.artboard .whisk,.artboard .spatula,.artboard .mixing-bowl,.artboard .prompt,.artboard .next { transition:opacity .52s ease-out, transform .52s ease-out; }.artboard.leaving .title,.artboard.leaving .food,.artboard.leaving .whisk,.artboard.leaving .spatula,.artboard.leaving .mixing-bowl,.artboard.leaving .prompt,.artboard.leaving .next { opacity:0; pointer-events:none; }
    @keyframes ingredient-pop { 0% { transform:scale(1); } 38% { transform:scale(1.24); } 66% { transform:scale(.87); } 84% { transform:scale(1.07); } 100% { transform:scale(1); } }
    @keyframes bowl-pop { 0% { transform:scale(1); } 38% { transform:scale(1.18); } 64% { transform:scale(.89); } 84% { transform:scale(1.08); } 100% { transform:scale(1); } }
    @keyframes bubble-hop { 0% { transform:translateY(0); } 45% { transform:translateY(-22px); } 72% { transform:translateY(4px); } 100% { transform:translateY(0); } }
    .food.pop img { animation:ingredient-pop .34s cubic-bezier(.22,.8,.28,1); }.mixing-bowl.pop { animation:bowl-pop .32s cubic-bezier(.22,.8,.28,1); transform-origin:center center; }.prompt.pop img,.next.pop img { animation:bubble-hop .32s cubic-bezier(.22,.8,.28,1); }.next.double-pop img { animation:bubble-hop .26s cubic-bezier(.22,.8,.28,1) 2; } @keyframes button-pop { 0% { transform:scale(1); } 28% { transform:scale(.8); } 58% { transform:scale(1.22); } 80% { transform:scale(.93); } 100% { transform:scale(1); } }.next.click-pop img { animation:button-pop .32s cubic-bezier(.22,.8,.28,1); }
  </style>
</head>
<body>
  <main class="screen"><div class="background"></div><div class="artboard" id="artboard">
    <img class="title" src="assets/ingredients/ingredients-title.png" alt="依次放入食材" />
    <button class="food flour" data-food="flour" aria-label="加入面粉"><img src="assets/ingredients/ingredient-flour.png" alt="" /></button>
    <button class="food sugar" data-food="sugar" aria-label="加入糖"><img src="assets/ingredients/ingredient-sugar.png" alt="" /></button>
    <button class="food oil" data-food="oil" aria-label="加入油"><img src="assets/ingredients/ingredient-oil.png" alt="" /></button>
    <img class="whisk" src="assets/ingredients/prop-whisk.png" alt="" /><img class="spatula" src="assets/ingredients/prop-spatula.png" alt="" />
    <button class="mixing-bowl" aria-label="混合碗"><img id="bowl" src="assets/ingredients/mixing-bowl-00.png" alt="空碗" /></button>
    <button class="prompt" id="prompt" type="button"><img id="prompt-image" src="assets/ingredients/bubble-add-flour.png" alt="加入面粉！" /></button><button class="next" id="next" type="button" hidden><img src="assets/ingredients/bubble-start-kneading.png" alt="开始揉面吧！" /></button>
    <img class="character left" id="character-left" src="assets/ingredients/ingredients-character-left.png" alt="" /><img class="character right" id="character-right" src="assets/ingredients/ingredients-character-right.png" alt="" />
  </div></main>
  <script>
    // 食材页只能由开始页进入；在本页刷新则回到开始页重新开始。
    const isEmbedded = new URLSearchParams(window.location.search).has('embedded');
    if (!isEmbedded && sessionStorage.getItem('moon-cake-entered-ingredients') !== '1') {
      window.location.replace('index.html');
    } else {
      sessionStorage.removeItem('moon-cake-entered-ingredients');
    }
    const artboard=document.querySelector('#artboard'), bowl=document.querySelector('#bowl'), mixingBowl=document.querySelector('.mixing-bowl'), prompt=document.querySelector('#prompt'), promptImage=document.querySelector('#prompt-image'), next=document.querySelector('#next'), leftCharacter=document.querySelector('#character-left'), rightCharacter=document.querySelector('#character-right');
    const order=['flour','sugar','oil'], names={flour:'面粉',sugar:'糖',oil:'油'}, bubbleFiles=['bubble-add-flour.png','bubble-add-sugar.png','bubble-add-oil.png']; let step=0, animating=false;
    function resize(){const scale=Math.min(1,innerHeight/1920), logical=innerWidth/scale, side=Math.max(0,(logical-1080)*.12), groupWidth=1036, characterScale=Math.min(1,logical/groupWidth), characterLeft=540-groupWidth*characterScale/2-side, characterRight=characterLeft+555*characterScale+side*2; artboard.style.setProperty('--scale',scale); artboard.style.setProperty('--side',side+'px'); artboard.style.setProperty('--character-scale',characterScale); artboard.style.setProperty('--character-left',characterLeft+'px'); artboard.style.setProperty('--character-right',characterRight+'px');} resize(); addEventListener('resize',resize);
    function pop(element,className='pop',duration=500){element.classList.remove(className); void element.offsetWidth; element.classList.add(className); setTimeout(()=>element.classList.remove(className),duration);}
    document.querySelectorAll('.food').forEach(button=>button.addEventListener('click',()=>{if(animating||button.dataset.food!==order[step]) return; animating=true; button.classList.add('used'); pop(button,'pop',360); step++; bowl.src=`assets/ingredients/mixing-bowl-0${step}.png`; bowl.alt=`已加入${names[button.dataset.food]}的碗`; pop(mixingBowl,'pop',340); if(step===3){setTimeout(()=>{prompt.hidden=true; next.hidden=false; pop(next,'double-pop',560); leftCharacter.src='assets/ingredients/ingredients-character-left-smile.png'; rightCharacter.src='assets/ingredients/ingredients-character-right-smile.png';},340); return;} setTimeout(()=>{promptImage.src=`assets/ingredients/${bubbleFiles[step]}`; promptImage.alt=`加入${names[order[step]]}！`; pop(prompt,'pop',340); animating=false;},340);}));
    next.addEventListener('click',()=>{if(next.dataset.clicked)return;next.dataset.clicked='1';pop(next,'click-pop',350);setTimeout(()=>window.parent.postMessage({type:'open-knead'},'*'),320)});
    addEventListener('message',event=>{if(event.data?.type==='fade-ingredients'){artboard.classList.add('leaving');leftCharacter.src='assets/ingredients/ingredients-character-left.png';rightCharacter.src='assets/ingredients/ingredients-character-right.png'}if(event.data?.type==='characters-normal'){leftCharacter.src='assets/ingredients/ingredients-character-left.png';rightCharacter.src='assets/ingredients/ingredients-character-right.png'}if(event.data?.type==='characters-smile'){leftCharacter.src='assets/ingredients/ingredients-character-left-smile.png';rightCharacter.src='assets/ingredients/ingredients-character-right-smile.png'}});
  </script>
</body>
</html>
