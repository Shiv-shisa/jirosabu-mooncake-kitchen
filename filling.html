<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>包馅｜二三郎的月饼工房</title><script>document.documentElement.classList.add('foreground')</script><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}.screen{height:100svh}.artboard{position:absolute;top:0;left:50%;width:1080px;height:1920px;transform:translateX(-50%) scale(var(--scale,.5));transform-origin:top center}.artboard img{position:absolute;display:block;pointer-events:none;user-select:none}.title{width:544px;top:94px;left:268px}.filling{position:absolute;padding:0;border:0;background:transparent;cursor:pointer;transition:transform .18s ease-out,opacity .3s ease-out}.filling:hover{transform:translateY(-26px) rotate(-2deg)}.filling img{position:static;width:100%;height:auto}.lotus{width:263px;top:273px;left:232px}.yolk{width:263px;top:273px;left:585px}.filling.used{opacity:1;pointer-events:none}.board{position:absolute;z-index:1;width:730px;height:501px;top:574px;left:175px}.dough{position:absolute;z-index:2;top:824px;left:540px;width:285px;height:276px;padding:0;border:0;background:transparent;cursor:pointer;transform:translate(-50%,-50%)}.dough img{position:static;width:100%;height:100%;object-fit:contain}.prompt,.next{position:absolute;z-index:3;display:grid;place-items:center;padding:0;border:0;background:transparent;cursor:pointer}.prompt{width:864px;height:227px;top:1115px;left:108px;pointer-events:none}.next{width:571px;height:231px;top:1113px;left:255px}.prompt img,.next img{position:static;width:auto;height:auto;max-width:100%;max-height:100%}.prompt[hidden],.next[hidden]{display:none}.artboard .title,.artboard .filling,.artboard .board,.artboard .dough,.artboard .prompt,.artboard .next{transition:opacity .52s ease-out,transform .52s ease-out}.artboard.leaving .title,.artboard.leaving .filling,.artboard.leaving .board,.artboard.leaving .dough,.artboard.leaving .prompt,.artboard.leaving .next{opacity:0;pointer-events:none}@keyframes pop{0%{transform:translateY(0)}45%{transform:translateY(-22px)}72%{transform:translateY(4px)}100%{transform:translateY(0)}}@keyframes ingredient-pop{0%{transform:scale(1)}38%{transform:scale(1.24)}66%{transform:scale(.87)}84%{transform:scale(1.07)}100%{transform:scale(1)}}@keyframes bowl-pop{0%{transform:scale(1)}38%{transform:scale(1.18)}64%{transform:scale(.89)}84%{transform:scale(1.08)}100%{transform:scale(1)}}.filling.pop img{animation:ingredient-pop .34s cubic-bezier(.22,.8,.28,1)}.dough.pop img{animation:bowl-pop .32s cubic-bezier(.22,.8,.28,1)}.prompt.pop img,.next.pop img{animation:pop .38s cubic-bezier(.22,.8,.28,1)}.next.double-pop img{animation:pop .26s cubic-bezier(.22,.8,.28,1) 2}
.filling.used{pointer-events:auto!important}
</style></head><body><main class="screen"><div class="artboard" id="artboard"><img class="title" src="assets/filling/filling-title.png" alt="开始包馅料！"><button class="filling lotus" data-fill="lotus"><img src="assets/filling/filling-lotus.png" alt="莲蓉馅"></button><button class="filling yolk" data-fill="yolk"><img src="assets/filling/filling-double-yolk.png" alt="双蛋黄"></button><img class="board" src="assets/knead/knead-board.png" alt="砧板"><button class="dough" id="dough"><img id="dough-image" src="assets/filling/dough-open.png" alt="面皮"></button><button class="prompt" id="prompt"><img id="prompt-image" src="assets/filling/bubble-add-lotus.png" alt="先放入莲蓉馅"></button><button class="next" id="next" hidden><img src="assets/filling/button-to-mold.png" alt="去压模吧！"></button></div></main><script>
const artboard=document.querySelector('#artboard'),dough=document.querySelector('#dough'),doughImage=document.querySelector('#dough-image'),prompt=document.querySelector('#prompt'),promptImage=document.querySelector('#prompt-image'),next=document.querySelector('#next');let stage=0,wrapping=false;function resize(){const s=Math.min(1,innerHeight/1920);artboard.style.setProperty('--scale',s)}resize();addEventListener('resize',resize);function pop(el,cls='pop',time=450){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),time)}document.querySelectorAll('.filling').forEach(b=>b.addEventListener('click',()=>{if(wrapping)return;if(b.dataset.fill==='lotus'&&stage===0){stage=1;pop(b,'pop',340);setTimeout(()=>b.classList.add('used'),340);doughImage.src='assets/filling/dough-with-lotus.png';pop(dough,'pop',340);promptImage.src='assets/filling/bubble-add-yolk.png';pop(prompt)}else if(b.dataset.fill==='yolk'&&stage===1){stage=2;pop(b,'pop',340);setTimeout(()=>b.classList.add('used'),340);doughImage.src='assets/filling/dough-with-filling.png';pop(dough,'pop',340);promptImage.src='assets/filling/bubble-start-wrap.png';pop(prompt);wrapping=true}}));dough.addEventListener('click',()=>{if(!wrapping)return;stage++;const frames=['dough-wrap-01.png','dough-wrap-02.png','dough-wrap-03.png','dough-wrap-04.png'];doughImage.src=`assets/filling/${frames[Math.min(stage-3,3)]}`;pop(dough,'pop',340);if(stage>=6){wrapping=false;prompt.hidden=true;next.hidden=false;pop(next,'double-pop',560);window.parent.postMessage({type:'characters-smile'},'*')}});next.addEventListener('click',()=>{if(next.dataset.clicked)return;next.dataset.clicked='1';pop(next,'pop',340);setTimeout(()=>window.parent.postMessage({type:'open-mold'},'*'),280)});addEventListener('message',e=>{if(e.data?.type==='fade-filling')artboard.classList.add('leaving')});
document.querySelectorAll('.filling').forEach(button=>button.addEventListener('click',()=>{if(button.classList.contains('used'))pop(button,'pop',340)}));dough.addEventListener('click',()=>{if(stage>=6)pop(dough,'pop',340)});
</script></body></html>
