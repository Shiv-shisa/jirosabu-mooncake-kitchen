<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>中秋快乐｜保存照片</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#5756e9;font-family:"Microsoft YaHei",sans-serif}.screen{position:relative;height:100svh;overflow:hidden}.backdrop{position:absolute;inset:0;background:url('assets/finish/finish-bg-sky.jpg') center top/cover no-repeat}.backdrop::before{content:"";position:absolute;z-index:1;left:0;right:0;bottom:0;height:16%;background:#E2C3FA}.backdrop::after{content:"";position:absolute;left:0;right:0;bottom:16%;height:32.25%;background:url('assets/finish/finish-bg-table.jpg') center bottom/auto 100% repeat-x}.artboard{position:absolute;top:0;left:50%;width:1080px;height:1920px;transform:translateX(-50%) scale(var(--scale,.5));transform-origin:top center}.artboard img{position:absolute;display:block;pointer-events:none;user-select:none}.moon{width:345px;top:232px;left:calc(710px + var(--side,0px))}.star-large{width:106px;top:84px;left:calc(170px - var(--side,0px))}.star-small{width:31px;top:112px;left:calc(988px + var(--side,0px))}.cloud-left{width:625px;top:458px;left:calc(-16px - var(--side,0px))}.cloud-right{width:534px;top:688px;left:calc(734px + var(--side,0px))}.polaroid{position:absolute;z-index:2;width:880px;top:330px;left:100px;padding:0;border:0;background:transparent;cursor:pointer;opacity:0;transform:translateY(46px);transition:opacity .78s cubic-bezier(.16,.88,.24,1),transform .78s cubic-bezier(.16,.88,.24,1)}.polaroid.show{opacity:1;transform:translateY(0)}.polaroid img{position:static;width:100%;height:auto}.save{position:absolute;z-index:2;width:455px;top:1630px;left:312.5px;padding:0;border:0;background:transparent;cursor:pointer}.save img{position:static;width:100%;height:auto}@keyframes ingredient-pop{0%{transform:scale(1)}38%{transform:scale(1.24)}66%{transform:scale(.87)}84%{transform:scale(1.07)}100%{transform:scale(1)}}.polaroid.pop img,.save.pop img{animation:ingredient-pop .34s cubic-bezier(.22,.8,.28,1)}
.backdrop{z-index:0}.artboard{z-index:2}.polaroid{transform:translateY(46px) scale(.8);transform-origin:center center;transition:opacity 1.25s cubic-bezier(.16,.88,.24,1),transform 1.25s cubic-bezier(.16,.88,.24,1)}.polaroid.show{transform:translateY(0) scale(.8)}.save{top:1610px}
</style></head><body><main class="screen"><div class="backdrop"></div><div class="artboard" id="artboard"><img class="moon" src="assets/finish/finish-moon.png" alt=""><img class="star-large" src="assets/finish/finish-star-large.png" alt=""><img class="star-small" src="assets/finish/finish-star-small-01.png" alt=""><img class="cloud-left" src="assets/finish/finish-cloud-left.png" alt=""><img class="cloud-right" src="assets/finish/finish-cloud-right.png" alt=""><button class="polaroid" id="polaroid" aria-label="长按保存拍立得"><img id="polaroid-image" src="assets/finish/polaroid-01.png" alt="月饼拍立得"></button><button class="save" id="save" aria-label="保存照片"><img src="assets/finish/button-save.png" alt="保存照片"></button></div></main><script>
const artboard=document.querySelector('#artboard'),polaroid=document.querySelector('#polaroid'),polaroidImage=document.querySelector('#polaroid-image'),save=document.querySelector('#save');let variant=1,holdTimer;function resize(){const scale=Math.min(1,innerHeight/1920),logical=innerWidth/scale;artboard.style.setProperty('--scale',scale);artboard.style.setProperty('--side',Math.max(0,(logical-1080)*.12)+'px')}resize();addEventListener('resize',resize);function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),340)}function download(){const link=document.createElement('a');link.href=polaroidImage.src;link.download=`我的月饼-${variant}.png`;document.body.appendChild(link);link.click();link.remove()}function clearHold(){clearTimeout(holdTimer);holdTimer=null}polaroid.addEventListener('click',()=>pop(polaroid));polaroid.addEventListener('pointerdown',()=>{clearHold();holdTimer=setTimeout(()=>{pop(polaroid);download();holdTimer=null},650)});polaroid.addEventListener('pointerup',clearHold);polaroid.addEventListener('pointercancel',clearHold);polaroid.addEventListener('pointerleave',clearHold);polaroid.addEventListener('contextmenu',event=>event.preventDefault());save.addEventListener('click',()=>{pop(save);download()});addEventListener('message',event=>{if(event.data?.type==='enter-finish'){variant=event.data.variant||1;polaroidImage.src=`assets/finish/polaroid-0${variant}.png`;requestAnimationFrame(()=>requestAnimationFrame(()=>polaroid.classList.add('show')))}});
</script></body></html>
