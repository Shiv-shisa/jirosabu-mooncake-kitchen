<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>烤月饼｜二三郎的月饼工房</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}.screen{height:100svh}.artboard{position:absolute;top:0;left:50%;width:1080px;height:1920px;transform:translateX(-50%) scale(var(--scale,.5));transform-origin:top center}.artboard img{position:absolute;display:block;pointer-events:none;user-select:none}.title{width:544px;top:72px;left:268px}.oven,.tray{position:absolute;padding:0;border:0;background:transparent;cursor:pointer}.oven{z-index:2;width:859px;top:155px;left:110px}.tray{z-index:2;width:551px;top:690px;left:265px}.oven img,.tray img{position:static;width:100%;height:auto}.clock{position:absolute;z-index:3;width:410px;height:410px;top:706px;left:335px;display:none}.clock.show{display:block}.clock img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.clock .hand{animation:spin 1.15s linear infinite}.clock.stopped .hand{animation-play-state:paused}@keyframes spin{to{transform:rotate(360deg)}}@keyframes ingredient-pop{0%{transform:scale(1)}38%{transform:scale(1.24)}66%{transform:scale(.87)}84%{transform:scale(1.07)}100%{transform:scale(1)}}.oven.pop img,.tray.pop img{animation:ingredient-pop .34s cubic-bezier(.22,.8,.28,1)}.prompt,.next{position:absolute;z-index:4;display:grid;place-items:center;padding:0;border:0;background:transparent}.prompt{width:864px;height:227px;top:1110px;left:108px;pointer-events:none}.next{width:571px;height:230px;top:1110px;left:255px;cursor:pointer}.prompt img,.next img{position:static;width:auto;height:auto;max-width:100%;max-height:100%}.prompt[hidden],.next[hidden]{display:none}@keyframes pop{0%{transform:translateY(0)}45%{transform:translateY(-22px)}72%{transform:translateY(4px)}100%{transform:translateY(0)}}.prompt.pop img,.next.pop img{animation:pop .38s cubic-bezier(.22,.8,.28,1)}.next.double-pop img{animation:pop .26s cubic-bezier(.22,.8,.28,1) 2}.artboard .title,.artboard .oven,.artboard .tray,.artboard .clock,.artboard .prompt,.artboard .next{transition:opacity .52s ease-out,transform .52s ease-out}
.oven{width:687px;top:265px;left:196px}.tray{width:441px;top:730px;left:319.5px}.clock{width:328px;height:328px;top:767px;left:376px}.clock .hand{animation:spin 1.4s linear infinite}.clock.stopped .hand{animation-play-state:paused;transform:none}.artboard.leaving .title,.artboard.leaving .oven,.artboard.leaving .tray,.artboard.leaving .clock,.artboard.leaving .prompt,.artboard.leaving .next{opacity:0;pointer-events:none}
</style></head><body><main class="screen"><div class="artboard" id="artboard"><img class="title" src="assets/oven/bake-title.png" alt="烤月饼吧！"><button class="oven" id="oven" aria-label="烤箱"><img id="oven-image" src="assets/oven/oven-closed-off.png" alt="关着的烤箱"></button><button class="tray" id="tray" aria-label="放着生月饼的托盘"><img id="tray-image" src="assets/oven/tray-raw-01.png" alt="生月饼托盘"></button><div class="clock" id="clock"><img src="assets/oven/clock-face.png" alt="时钟"><img class="hand" src="assets/oven/clock-hand.png" alt=""></div><div class="prompt" id="prompt"><img id="prompt-image" src="assets/oven/bubble-bake-01.png" alt="点击烤箱，准备烤月饼！"></div><button class="next" id="next" hidden><img src="assets/oven/button-finished.png" alt="月饼做好啦！"></button></div></main><script>
const artboard=document.querySelector('#artboard'),oven=document.querySelector('#oven'),ovenImage=document.querySelector('#oven-image'),tray=document.querySelector('#tray'),trayImage=document.querySelector('#tray-image'),clock=document.querySelector('#clock'),prompt=document.querySelector('#prompt'),promptImage=document.querySelector('#prompt-image'),next=document.querySelector('#next');let stage=0,variant=1;function resize(){artboard.style.setProperty('--scale',Math.min(1,innerHeight/1920))}resize();addEventListener('resize',resize);function pop(el,cls='pop',time=450){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),time)}function finishBake(){clock.classList.add('stopped');ovenImage.src='assets/oven/oven-closed-tray-off.png';pop(oven,'pop',340);setTimeout(()=>{prompt.hidden=true;next.hidden=false;pop(next,'double-pop',560);window.parent.postMessage({type:'characters-smile'},'*')},340)}oven.addEventListener('click',()=>{if(stage===0){stage=1;pop(oven,'pop',340);setTimeout(()=>{ovenImage.src='assets/oven/oven-open.png';promptImage.src='assets/oven/bubble-bake-02.png';pop(prompt)},340);return}if(stage===2){stage=3;pop(oven,'pop',340);setTimeout(()=>{ovenImage.src='assets/oven/oven-closed-tray-on.png';promptImage.src='assets/oven/bubble-bake-03.png';clock.classList.remove('stopped');clock.classList.add('show');setTimeout(finishBake,2800)},340)}});tray.addEventListener('click',()=>{if(stage!==1)return;stage=2;pop(tray,'pop',340);setTimeout(()=>{tray.hidden=true;ovenImage.src='assets/oven/oven-closed-tray-off.png';promptImage.src='assets/oven/bubble-bake-03.png';pop(prompt)},340)});next.addEventListener('click',()=>{if(next.dataset.clicked)return;next.dataset.clicked='1';pop(next,'pop',340);setTimeout(()=>window.parent.postMessage({type:'open-finish',variant},'*'),280)});addEventListener('message',event=>{if(event.data?.type==='enter-oven'){variant=event.data.variant||1;trayImage.src=`assets/oven/tray-raw-0${variant}.png`}if(event.data?.type==='fade-oven')artboard.classList.add('leaving')});
</script></body></html>
