<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>压月饼｜二三郎的月饼工房</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}.screen{height:100svh}.artboard{position:absolute;top:0;left:50%;width:1080px;height:1920px;transform:translateX(-50%) scale(var(--scale,.5));transform-origin:top center}.artboard img{position:absolute;display:block;pointer-events:none;user-select:none}.title{width:461px;top:72px;left:310px}.board{position:absolute;z-index:1;width:610px;height:auto;top:594px;left:235px}.dough{position:absolute;z-index:2;width:235px;top:693px;left:423px}.mold{position:absolute;z-index:3;top:155px;left:389px;width:303px;height:410px;padding:0;border:0;background:transparent;cursor:pointer;transition:transform .38s cubic-bezier(.16,.88,.24,1)}.mold img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.mold .handle{transition:transform .22s cubic-bezier(.25,.85,.3,1)}.mold.on-dough{transform:translateY(470px)}.mold.pressing .handle{transform:translateY(62px)}.cake{position:absolute;z-index:4;width:260px;top:670px;left:410px;opacity:0;transform:scale(.7);transition:opacity .2s ease-out,transform .35s cubic-bezier(.16,.88,.24,1)}.cake.show{opacity:1;transform:scale(1)}.prompt,.next{position:absolute;z-index:5;display:grid;place-items:center;padding:0;border:0;background:transparent}.prompt{width:864px;height:219px;top:1110px;left:108px}.next{width:571px;height:230px;top:1110px;left:255px;cursor:pointer}.prompt img,.next img{position:static;width:auto;height:auto;max-width:100%;max-height:100%}.prompt[hidden],.next[hidden]{display:none}@keyframes pop{0%{transform:translateY(0)}45%{transform:translateY(-22px)}72%{transform:translateY(4px)}100%{transform:translateY(0)}}.prompt.pop img,.next.pop img{animation:pop .38s cubic-bezier(.22,.8,.28,1)}.next.double-pop img{animation:pop .26s cubic-bezier(.22,.8,.28,1) 2}.artboard .title,.artboard .board,.artboard .dough,.artboard .mold,.artboard .cake,.artboard .prompt,.artboard .next{transition:opacity .52s ease-out,transform .52s ease-out}
.mold{transition:transform .5s cubic-bezier(.02,.98,.18,1)}.mold.on-dough{transform:translateY(390px)}.artboard .cake{z-index:2;width:247px;left:416.5px;transition:none}.artboard .dough{transition:none}.cake.show{opacity:1;transform:scale(1)}.artboard.leaving .title,.artboard.leaving .board,.artboard.leaving .dough,.artboard.leaving .mold,.artboard.leaving .cake,.artboard.leaving .prompt,.artboard.leaving .next{opacity:0;pointer-events:none}
</style></head><body><main class="screen"><div class="artboard" id="artboard"><img class="title" src="assets/mold/mold-title.png" alt="压出月饼吧！"><img class="board" src="assets/knead/knead-board.png" alt="砧板"><img class="dough" src="assets/mold/dough-before-mold.png" alt="包好的面团"><button class="mold" id="mold" aria-label="拿起模具压出图案"><img src="assets/mold/moon-moldbottom.png" alt=""><img class="handle" src="assets/mold/moon-moldbutton.png" alt=""></button><img class="cake" id="cake" alt="压好的月饼"><div class="prompt" id="prompt"><img src="assets/mold/bubble-mold-01.png" alt="拿起模具，压出图案！"></div><button class="next" id="next" hidden><img src="assets/mold/button-to-oven.png" alt="送进烤箱吧！"></button></div></main><script>
const artboard=document.querySelector('#artboard'),mold=document.querySelector('#mold'),dough=document.querySelector('.dough'),cake=document.querySelector('#cake'),prompt=document.querySelector('#prompt'),next=document.querySelector('#next');let stage=0,cakeVariant=1;function resize(){artboard.style.setProperty('--scale',Math.min(1,innerHeight/1920))}resize();addEventListener('resize',resize);function pop(el,cls='pop',time=450){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),time)}mold.addEventListener('click',()=>{if(stage===0){stage=1;mold.classList.add('on-dough');return}if(stage===1){stage=2;mold.classList.add('pressing');setTimeout(()=>mold.classList.remove('pressing'),260);return}if(stage===2){stage=3;mold.classList.remove('on-dough');dough.style.opacity='0';cakeVariant=1+Math.floor(Math.random()*3);cake.src=`assets/mold/mooncake-0${cakeVariant}.png`;cake.classList.add('show');prompt.hidden=true;next.hidden=false;pop(next,'double-pop',560);window.parent.postMessage({type:'characters-smile'},'*')}});next.addEventListener('click',()=>{if(next.dataset.clicked)return;next.dataset.clicked='1';pop(next,'pop',340);setTimeout(()=>window.parent.postMessage({type:'open-oven',variant:cakeVariant},'*'),280)});addEventListener('message',event=>{if(event.data?.type==='fade-mold')artboard.classList.add('leaving')});
</script></body></html>
